[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-infra"
description = "RoboLab robot research infrastructure and local console"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6",
    "opencv-python-headless>=4.8",
    "h5py>=3.8",
    "websockets>=14.0",
    "msgpack>=1.0.8",
    "msgpack-numpy>=0.4.8",
    "pydantic>=2.5",
]

[tool.setuptools]
py-modules = ["XPolicyLab", "_robolab_compat"]

[tool.setuptools.packages.find]
where = ["."]
include = ["client_server*", "utils*", "environment*", "web*", "evaluation*"]
exclude = ["policy*", "build*", "scripts*", "__pycache__*", "tests*"]

[tool.setuptools.package-data]
web = ["static/*"]
