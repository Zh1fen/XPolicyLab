name: Workspace checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focus policy workspace
        run: python3 scripts/policy_workspace.py focus
      - name: Check docs, configuration and entrypoint syntax
        run: python3 scripts/check_workspace.py
      - name: Install core infra dependencies
        run: python -m pip install -e .
      - name: Test workspace recovery and launch commands
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
      - name: Smoke websocket and unified environment interfaces
        run: python scripts/smoke_infra.py
