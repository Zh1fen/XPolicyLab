<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="xpl-token" content="__XPL_TOKEN__"><meta name="color-scheme" content="light">
  <title>RoboLab · 控制台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="icon-robot" viewBox="0 0 24 24"><path d="M12 3v3m-2-3h4"/><rect x="4" y="6" width="16" height="14" rx="4"/><path d="M1 11v5m22-5v5m-15 0h8"/><circle cx="9" cy="11" r=".75"/><circle cx="15" cy="11" r=".75"/></symbol><symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol><symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/><path d="M12 7v5l3 2"/></symbol><symbol id="icon-boxes" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7m-3.5-3.5v7"/></symbol><symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 7a7 7 0 0 1 12-2L20 8M4 16l2.5 3a7 7 0 0 0 12-2"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol><symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol><symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol><symbol id="icon-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol><symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 15v-3m5 3V8m5 7V5"/></symbol><symbol id="icon-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4m-6 12v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></symbol><symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol></svg>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="RoboLab 控制台首页"><span class="brand-mark"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-robot"/></svg></span><span>RoboLab<small>控制台</small></span></a>
    <nav aria-label="主导航">
      <button class="nav-item active" data-view="overview" aria-label="评测概览"><svg class="icon nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-grid"/></svg><span>评测概览</span></button>
      <button class="nav-item" data-view="history" aria-label="运行记录"><svg class="icon nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-history"/></svg><span>运行记录</span><span id="nav-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="resources" aria-label="资源与接入"><svg class="icon nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-boxes"/></svg><span>资源与接入</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="version">RoboLab<span>v0.1</span></div></div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="breadcrumb">控制台<span>/</span><strong id="breadcrumb-view">评测概览</strong></div><div class="topbar-right"><span class="connection" id="connection"><i></i>连接中</span></div></header>
    <main>
      <section class="page-heading"><div><h1 id="page-title">评测概览</h1></div><div class="heading-actions"><button class="button secondary" id="quick-check" aria-label="协议检查"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-activity"/></svg><span>协议检查</span></button><button class="button secondary" id="refresh-btn" aria-label="刷新数据"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-refresh"/></svg><span>刷新</span></button><button class="button primary" id="new-run-btn" aria-label="新建评测"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-plus"/></svg>新建评测</button></div></section>
      <div class="error-banner" id="error-banner" hidden role="alert"></div>
      <section class="stats-grid" id="stats-grid" aria-label="运行统计">
        <article class="stat-card"><div class="stat-label">进行中<span class="stat-glyph violet"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-activity"/></svg></span></div><div class="stat-number" id="stat-active">0<span>项运行</span></div><div class="stat-foot"><i class="mini-dot"></i>串行队列</div></article>
        <article class="stat-card"><div class="stat-label">评测记录<span class="stat-glyph blue"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-history"/></svg></span></div><div class="stat-number" id="stat-total">0<span>项记录</span></div><div class="stat-foot" id="stat-completed">尚未开始评测</div></article>
        <article class="stat-card"><div class="stat-label">LIBERO · 四组平均<span class="stat-glyph green"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chart"/></svg></span></div><div class="stat-number" id="stat-rate">—</div><div class="stat-foot" id="stat-rate-note">暂无完整评测</div></article>
        <article class="stat-card"><div class="stat-label">活动策略<span class="stat-glyph amber"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chip"/></svg></span></div><div class="stat-number" id="stat-policies">—<span>个模型入口</span></div></article>
      </section>
      <div class="content-grid" id="content-grid">
        <section class="panel runs-panel" id="runs-panel"><div class="panel-heading"><div><h2 id="table-title">最近运行</h2></div><span class="live-tag"><i></i>实时更新</span></div>
          <div class="table-toolbar"><label class="search"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-search"/></svg><input id="run-search" type="search" placeholder="搜索运行名称、模型或任务" aria-label="搜索运行记录"></label><select id="status-filter" aria-label="筛选运行状态"><option value="all">全部状态</option><option value="running">进行中</option><option value="queued">等待中</option><option value="succeeded">已完成</option><option value="failed">失败 / 中断</option><option value="cancelled">已取消</option></select></div>
          <div class="table-container"><table><thead><tr><th>运行 / 模型</th><th>评测任务</th><th>状态</th><th>结果</th><th>创建时间</th><th></th></tr></thead><tbody id="run-rows"></tbody></table></div>
          <div class="empty-state" id="empty-state"><div class="empty-orbit"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-play"/></svg></div><h3>暂无运行记录</h3><button class="button secondary" id="empty-start">新建评测</button></div>
          <div class="table-footer"><span id="record-count">0 条运行记录</span></div>
        </section>
        <aside class="panel environment-panel" id="environment-panel"><div class="panel-heading"><div><h2>评测环境</h2></div></div><div id="benchmark-cards" class="benchmark-cards"></div></aside>
      </div>
      <section class="panel resources-panel" id="resources-panel" hidden><div class="panel-heading"><div><h2>模型</h2></div></div><div id="policy-grid" class="policy-grid"></div></section>
    </main>
  </div>
</div>
<dialog id="run-dialog" class="drawer"><form id="run-form"><header class="dialog-header"><div><h2>新建评测</h2></div><button type="button" class="close-button" data-close="run-dialog" aria-label="关闭新建评测"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></button></header><div class="dialog-body">
  <label class="field">运行名称 <span class="optional">可选</span><input name="label" maxlength="100" placeholder="例如：pi05-libero-spatial-seed0"></label>
  <div class="form-section-label"><span>01</span> 模型与评测入口</div>
  <div class="form-grid"><label class="field">策略模型<select name="policy" required></select></label><label class="field">Benchmark<select name="benchmark" required></select></label></div>
  <label class="field">评测范围 / 任务集<select name="task" required></select></label>
  <label class="field" id="checkpoint-field">Checkpoint<select name="checkpoint"></select></label>
  <div class="preflight" id="preflight" aria-live="polite"></div>
  <div class="form-section-label"><span>02</span> 运行参数</div>
  <div class="form-grid"><label class="field">随机种子<input name="seed" type="number" min="0" max="2147483647" value="0" required></label><label class="field"><span id="episodes-label">每任务 Episodes</span><input name="episodes" type="number" min="1" max="50" value="3" required></label></div>
  <div class="form-grid" id="gpu-fields"><label class="field">模型 GPU<input name="policy_gpu" type="number" min="0" max="127" value="0" required></label><label class="field">环境 GPU<input name="env_gpu" type="number" min="0" max="127" value="0" required></label></div>
  <div class="form-grid" id="standard-fields"><label class="field">机器人配置<input name="robot" value="arx_x5"></label><label class="field">动作类型<select name="action_type"><option value="joint">joint</option><option value="ee">ee</option></select></label></div>
  <label class="field" id="max-steps-field">控制步数上限<input name="max_steps" type="number" min="1" max="100000" value="200"></label>
  <div class="form-hint" id="form-hint" hidden></div>
  <div class="form-error" id="form-error" role="alert" hidden></div>
</div><footer class="dialog-footer"><span></span><button type="submit" class="button primary" id="submit-run">加入队列</button></footer></form></dialog>
<dialog id="detail-dialog" class="detail-dialog"><header class="dialog-header"><div><div class="eyebrow" id="detail-id">RUN DETAILS</div><h2 id="detail-title">运行详情</h2><p id="detail-description"></p></div><button class="close-button" data-close="detail-dialog" aria-label="关闭运行详情"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></button></header><div class="detail-toolbar"><span id="detail-status"></span><span id="detail-stage"></span><div class="detail-actions"><button class="button secondary small" id="clone-run">使用此配置</button><button class="button danger small" id="cancel-run">停止运行</button></div></div><div id="detail-error" class="error-banner" hidden></div><div class="detail-metrics" id="detail-metrics"></div><section id="evaluation-results" hidden><div class="table-container"><table><thead><tr><th>任务集 / 任务</th><th>成功数 / 次数</th><th>成功率</th><th>设置</th></tr></thead><tbody id="evaluation-rows"></tbody></table></div><p class="form-hint" id="evaluation-note"></p></section><nav class="tabs" aria-label="运行详情视图"><button class="tab active" data-tab="logs">运行日志</button><button class="tab" data-tab="params">参数快照</button><button class="tab" data-tab="files">结果与产物</button></nav><div class="tab-content" id="tab-logs"><div class="log-toolbar"><span>STDOUT / STDERR</span><label><input type="checkbox" id="autoscroll" checked> 自动滚动</label></div><pre id="log-output" class="log-output" tabindex="0">等待进程输出…</pre></div><div class="tab-content" id="tab-params" hidden><pre id="parameter-output" class="parameter-output"></pre></div><div class="tab-content files-content" id="tab-files" hidden><div id="artifact-list"></div></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
